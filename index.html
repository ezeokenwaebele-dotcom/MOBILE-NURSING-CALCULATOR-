<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nursing Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🩺 Nursing Calculator</h1>

        <p class="subtitle">
            Simple clinical calculators for nursing students
        </p>

        <div class="card">

            <h2>⚖️ BMI Calculator</h2>

            <label for="weight">Weight (kg)</label>
            <input
                type="number"
                id="weight"
                placeholder="Enter weight in kg"
            >

            <label for="height">Height (cm)</label>
            <input
                type="number"
                id="height"
                placeholder="Enter height in cm"
            >

            <button onclick="calculateBMI()">
                Calculate BMI
            </button>

            <div class="result" id="bmiResult">
                Your result will appear here.
            </div>

        </div>

        <div class="card">

            <h2>💧 IV Drip Rate</h2>

            <p>
                More nursing calculators will be added here.
            </p>

        </div>

        <div class="card">

            <h2>💉 Drug Dosage</h2>

            <p>
                More nursing calculators will be added here.
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
